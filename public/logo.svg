<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" width="100%" height="100%" fill="none">
  <!-- PSN Brand Logo - Plastic Store Nigeria -->
  <defs>
    <linearGradient id="psnBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E56A0" />
      <stop offset="100%" stop-color="#0E366E" />
    </linearGradient>
    <linearGradient id="psnYellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD000" />
      <stop offset="100%" stop-color="#FDB813" />
    </linearGradient>
    <linearGradient id="psnGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0B192C" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Emblem Icon: Modern hexagonal-circular dynamic shield with cart and polymer swoosh -->
  <g transform="translate(10, 8)" filter="url(#subtleGlow)">
    <!-- Outer Shield / Hex Ring -->
    <path d="M 47 4 L 78 22 C 86 27, 90 34, 90 47 C 90 60, 86 67, 78 72 L 47 90 C 40 94, 30 94, 23 90 L 12 84 C 5 79, 0 71, 0 60 L 0 34 C 0 23, 5 15, 12 10 L 23 4 C 30 0, 40 0, 47 4 Z" fill="url(#psnBlueGrad)" />
    
    <!-- Dynamic Cart + Plastic Flow Curve in Bright Yellow -->
    <path d="M 24 32 L 34 32 L 44 58 L 68 58 L 74 40 L 38 40" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="48" cy="68" r="4.5" fill="#FFD000" />
    <circle cx="65" cy="68" r="4.5" fill="#FFD000" />

    <!-- Polymer/Sustainability Dynamic Arc Accent in Yellow & Green -->
    <path d="M 62 24 C 74 30, 80 42, 78 54" stroke="url(#psnYellowGrad)" stroke-width="4" stroke-linecap="round" fill="none" />
    <circle cx="78" cy="24" r="3.5" fill="#10B981" />
  </g>

  <!-- Typography -->
  <!-- PSN Acronym -->
  <text x="120" y="60" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="52" fill="#0B192C" letter-spacing="-1">
    PSN
  </text>

  <!-- Separator Pill -->
  <rect x="235" y="24" width="4" height="46" rx="2" fill="#FDB813" />

  <!-- Full Name and Subtitle -->
  <text x="252" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#1E56A0" letter-spacing="1.5">
    PLASTIC STORE NIGERIA
  </text>
  <text x="253" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#64748B" letter-spacing="2.5">
    DURABLE MERCHANDISE • WHOLESALE &amp; RETAIL
  </text>
</svg>
